[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "automated-pdf-report-generator"
version = "1.0.0"
description = "Enterprise Python CLI for automated PDF report generation and scheduling"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas",
    "reportlab",
    "schedule"
]

[project.scripts]
pdf-report = "main:main"

[tool.setuptools]
py-modules = ["main"]